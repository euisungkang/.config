source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

binde = Super+Shift, Page_Up, movetoworkspace, -1
binde = Super+Shift, Page_Down, movetoworkspace, +1
bind = Super+Shift, mouse_down, movetoworkspace, -1
bind = Super+Shift, mouse_up, movetoworkspace, +1

# Previous state (plain Hyprland focus, no Neovim handoff):
# bind = Control, h, movefocus, l
# bind = Control, j, movefocus, d
# bind = Control, k, movefocus, u
# bind = Control, l, movefocus, r

# Ctrl+hjkl: navigate Neovim splits when focused, else Hyprland windows.
# Falls through from nvim's edge splits to neighbouring Hyprland windows.
bind = Control, h, exec, ~/.config/hypr/scripts/nvim-nav.sh l h
bind = Control, j, exec, ~/.config/hypr/scripts/nvim-nav.sh d j
bind = Control, k, exec, ~/.config/hypr/scripts/nvim-nav.sh u k
bind = Control, l, exec, ~/.config/hypr/scripts/nvim-nav.sh r l

input {
	kb_options = caps:escape_shifted_capslock
}

# File indexer for KRunner file search (its autostart entry only runs under KDE/GNOME/XFCE)
exec-once = /usr/lib/kf6/baloo_file

# Toggle custom Discord Rich Presence on/off
bind = Super+Alt, d, exec, ~/.config/hypr/scripts/discord-presence-toggle.sh

# Open a new Haruna window with all videos in CORSAIR/nice/k loaded as the playlist
bind = Super+Alt, H, exec, ~/.config/hypr/scripts/haruna-k.sh

# AI usage desktop widget
exec-once = qs -c ai-usage

# Blur behind the AI usage widget (matches desktop clock plate)
layerrule = blur true, match:namespace ai-usage
layerrule = ignore_alpha 0.4, match:namespace ai-usage

# Credit card balance desktop widget (Plaid)
exec-once = qs -c plaid-balance
layerrule = blur true, match:namespace plaid-balance
layerrule = ignore_alpha 0.4, match:namespace plaid-balance

# Investments desktop widget (Plaid), sits above the credit card widget, top right
exec-once = qs -c plaid-invest
layerrule = blur true, match:namespace plaid-invest
layerrule = ignore_alpha 0.4, match:namespace plaid-invest

# Balance update prompt (plaid-invest/invest-update): small floating window that stays above the browser
windowrule = float true, match:class ^invest-update$
windowrule = pin true, match:class ^invest-update$
windowrule = size 360 110, match:class ^invest-update$
windowrule = move 100%-w-24 24, match:class ^invest-update$

# X Hub desktop widget: review and approve drafted X posts (top left)
exec-once = qs -c x-hub
layerrule = blur true, match:namespace x-hub
layerrule = ignore_alpha 0.4, match:namespace x-hub
