# ############# Themes #############
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize

# ######## Toolkit backends ########
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ####### XDG specifications #######
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
# Without this KDE apps (Dolphin "Open With", etc.) index no applications
env = XDG_DATA_DIRS, /usr/local/share:/usr/share:/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share
# Arch ships only plasma-applications.menu (no plain applications.menu);
# without this prefix kbuildsycoca6 finds no menu and indexes zero apps -> empty "Open With"
env = XDG_MENU_PREFIX, plasma-

# ############# Others #############
env = _JAVA_AWT_WM_NONREPARENTING, 1
# AQ_DRM_NO_EXPLICIT_SYNC must be set before launch (see /etc/environment);
# Hyprland's env= is parsed after aquamarine init, so it has no effect here.

# ######### Input method #########
env = XMODIFIERS, @im=fcitx
env = QT_IM_MODULE, fcitx
