# Arch ships only plasma-applications.menu (no generic applications.menu).
# Without this prefix, kbuildsycoca6 finds no menu and indexes zero apps,
# leaving Dolphin's "Open With" / default-app list empty.
# Lives here (not just hypr/env.conf) so apps launched via app2unit/systemd
# user scopes inherit it — Hyprland env= only reaches its direct children.
XDG_MENU_PREFIX=plasma-
